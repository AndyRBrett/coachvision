name: overseer-status

# Publish overseer-status.json on every run so the Project Overseer can tell
# "idle" from "broken". Runs weekly and on demand; commits the file when it changes.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Which sport the pipeline runs for. Set the repo/org variable COACHVISION_DOMAIN
# (Settings -> Secrets and variables -> Actions -> Variables) to "volleyball"
# to switch the whole automated pipeline -- detection, self-test, and status --
# without touching code. Defaults to martial_arts (the sport this project runs on).
env:
  COACHVISION_DOMAIN: ${{ vars.COACHVISION_DOMAIN || 'martial_arts' }}

jobs:
  write-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Auto-detect new footage in the watched drop folder and enqueue it
      # (Overseer #8). COACHVISION_DROP_DIR can point at a synced cloud bucket /
      # local dir; a missing folder is treated as "idle", not an error.
      - name: Scan drop folder for new footage
        run: python ingest_watch.py

      # Prove the CV pipeline works end-to-end on the active domain's bundled
      # reference clip and record results/selftest.json, so the status reflects a
      # *verified* (not merely idle) pipeline. A broken pipeline fails here and
      # is visible. Honors COACHVISION_DOMAIN above.
      - name: Pipeline self-test (reference clip)
        run: python pipeline.py --self-test

      # Publish the bundled clip as a demo session (#21). The self-test above
      # already ran the whole pipeline and threw the report away; this writes it
      # out so the dashboard has something to show before real footage exists,
      # and so the REPORT-WRITING path is exercised on every run rather than
      # first being tried the day real footage arrives.
      - name: Publish demo coaching report
        run: python demo.py

      - name: Write overseer status
        run: python write_status.py

      - name: Commit status + ingest state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overseer-status.json ingest_state.json ingest_queue.json \
                  results/selftest.json reports/demo reports/index.json
          if git diff --cached --quiet; then
            echo "No change to status or ingest state"
          else
            git commit -m "chore: update overseer status and ingest state"
            git push
          fi
