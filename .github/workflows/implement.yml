# Implementer for coachvision — configuration only.
#
# Everything the agent actually does (the author guard, the tier mapping, the
# prompt, the failure taxonomy) lives in one reusable workflow in the overseer.
# This file says which toolchain and which test command, and nothing else. It
# used to be a 215-line copy; a fix to the shared logic then meant five edits
# across four repos, and a security sweep hardened three copies and missed two.
#
# The job still runs HERE: a called workflow runs against the calling repo, so
# the checkout, the code, the branch and the Anthropic key are all coachvision's.
#
# Prerequisites, both already in place: the ANTHROPIC_API_KEY secret, and
# Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests" (without it the run does all the work and then cannot open
# the PR, while still reporting success).

name: Implement a filed issue

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment / close / label when it can't be implemented

concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    uses: AndyRBrett/overseer/.github/workflows/implementer.yml@main
    with:
      issue: ${{ github.event.client_payload.issue || inputs.issue }}
      tier: ${{ github.event.client_payload.tier || inputs.tier }}
      # tests.yml installs nothing: the suite is stdlib unittest and there is no
      # requirements.txt, so Python alone is the toolchain and pip_cache stays
      # off — setup-python fails caching without a dependency file.
      python_version: "3.x"
      test_command: python -m unittest discover -s tests -v
      test_note: >-
        If you touched pipeline.py or a detector, also run the two reference-clip
        self-tests CI gates on: `python pipeline.py --self-test --domain volleyball`
        and `python pipeline.py --self-test --domain martial_arts`.
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
