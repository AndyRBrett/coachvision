# One-shot CI verification that the ANTHROPIC_API_KEY repo secret produces real
# Claude coaching feedback (coaching/feedback.md) through the SDK path.
#
# Session tokens can't POST workflow dispatches, so this fires on push when this
# file itself changes -- the same steps as process-footage.yml with fixed inputs.
# Safe to delete once the check has run.
name: ci-feedback-check

on:
  push:
    paths:
      - ".github/workflows/ci-feedback-check.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install pose model deps
        run: pip install ultralytics opencv-python-headless anthropic

      - name: Decode + analyze footage (with Claude feedback)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty/unset in this run"
            exit 1
          fi
          python process_footage.py \
            --url "https://drive.google.com/uc?export=download&id=1NuyZbbn0tgKXhlCgxuuQWb5qwbGPMelp" \
            --domain martial_arts --fps 10 --name img_4501-ci --annotate

      - name: Assert feedback.md was produced
        run: |
          set -euo pipefail
          test -s reports/img_4501-ci/coaching/feedback.md || {
            echo "::error::feedback.md missing or empty -- the Claude call did not run";
            exit 1;
          }
          echo "--- feedback.md (first 20 lines) ---"
          head -20 reports/img_4501-ci/coaching/feedback.md

      - name: Refresh overseer status
        run: python write_status.py

      - name: Commit reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports overseer-status.json
          if git diff --cached --quiet; then
            echo "No new reports"
          else
            git commit -m "reports: CI feedback check (martial_arts, img_4501-ci)"
            git push
          fi
